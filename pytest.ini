[pytest]

# Test discovery limited strictly to tests/ directory
testpaths =
    tests

# Only files matching this pattern are considered tests
python_files =
    test_*.py

python_classes =
    Test*

python_functions =
    test_*

# Fail fast on unexpected warnings in future pytest versions
filterwarnings =
    error::pytest.PytestReturnNotNoneWarning

# Disable implicit plugin auto-loading (stability & determinism)
addopts =
    -q
    --strict-markers
    --disable-warnings

# Do not recurse into non-constitutional layers
norecursedirs =
    runtime_platform
    scripts
    governance
    sapianta_chat
    .git
    __pycache__