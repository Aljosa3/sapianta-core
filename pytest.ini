[pytest]

# =====================================================
# 🔍 TEST DISCOVERY (STRICT)
# =====================================================

testpaths =
    tests

python_files =
    test_*.py

python_classes =
    Test*

python_functions =
    test_*


# =====================================================
# ⚠️ WARNINGS (STRICT FUTURE SAFETY)
# =====================================================

filterwarnings =
    error::pytest.PytestReturnNotNoneWarning


# =====================================================
# ⚙️ EXECUTION SETTINGS
# =====================================================

addopts =
    -q
    --strict-markers
    --disable-warnings
    -p no:anyio


# =====================================================
# 🔒 DIRECTORY ISOLATION (CRITICAL)
# =====================================================

norecursedirs =
    runtime_platform
    scripts
    governance
    sapianta_chat
    .git
    __pycache__
    runtime/development/generated